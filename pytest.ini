[pytest]
# Root pytest config so a bare `pytest` (from the repo root, CI, or any cwd at or
# above this file) collects deterministically -- previously the only config lived
# at backend/pytest.ini, which a root-level `pytest` never discovered, so it
# scanned probe scripts and orphaned modules and errored on collection
# (bd polyglot-pdf-uov.1).
#
# pythonpath = . puts the repo root on sys.path so both test suites resolve their
# imports (backend.* for the backend suite; backend.config + importlib-loaded
# scripts for the top-level harness suite).
pythonpath = .

# The two REAL suites. Everything else named test_*.py in the tree is a
# standalone probe/manual script (scripts/test_*.py, backend/test_*.py) meant to
# be run via `python <file>`, not collected by pytest -- they take bare CLI args
# or live behind __main__ and break collection. They are excluded by simply not
# being under testpaths (and by norecursedirs below for safety).
#   - backend/tests : the backend unit/integration/contract suite
#   - tests         : the harness-tooling suite (closeout, bd_safe, next_bead, ...)
testpaths =
    backend/tests
    tests

# importlib import mode removes the legacy "import file mismatch" failure caused
# by duplicate test basenames with no __init__.py packaging (e.g. a
# test_section_switching.py under both scripts/ and backend/tests/unit/). With
# importlib, pytest does not rely on a unique top-level module name per file.
addopts = --import-mode=importlib

# Defense in depth: never descend into the probe-script dirs even if invoked with
# a broad path. Real suites live under testpaths above.
norecursedirs = scripts .venv node_modules .git build dist .claude

markers =
    external: marks tests requiring real Gemini access
