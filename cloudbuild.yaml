# Cloud Build definition for every polyglot-pdf deploy target.
#
# bd polyglot-pdf-1s3ko (Epic 4 of docs/sprint_22_admin-console_plan.md). ONE
# build file, selected by the _TARGET substitution, so the human path (the bash
# wrappers) and the console path (the admin service, bead 4.3) drive the same
# engine instead of two that drift.
#
# RUNS FROM GIT, NEVER FROM A TARBALL. .gcloudignore excludes frontend/,
# schema-editor/, landing/, tests/ and docs/, so a tarball build literally
# cannot build the site targets or run the suites -- and it would upload the
# LOCAL tree while COMMIT_SHA is empty, letting uncommitted code deploy under a
# SHA that build_checks then vouches for. Every build is therefore triggered
# against the 2nd-generation GitHub connection at an explicit commit
# (scripts/setup-cloud-build.sh), and the wrappers refuse a dirty or unpushed
# tree first (scripts/deploy_preflight.sh).
#
# THE VERIFY GATE. _TARGET=verify runs the backend + frontend + admin-console
# suites ONCE for a SHA and records build_checks/{_SHA}. Every DEPLOY target's
# FIRST step requires that record, so five targets for one commit pay one test
# run, and a commit whose suites failed cannot deploy by any route.
#
# _SHA vs COMMIT_SHA: COMMIT_SHA is populated by Cloud Build only when the
# build runs from a connected repo. _SHA is passed explicitly and is what the
# gate steps read and write, so the gate behaves identically however the build
# was started. The wrappers pass --sha=<sha> and the same value as _SHA.
#
# Node 22 matches .github/workflows/ci.yml, so a suite that passes in CI is
# running on the same runtime here.
#
# BASH VARIABLES MUST BE WRITTEN $$NAME, NOT $NAME. Cloud Build runs its own
# substitution pass over this file BEFORE bash ever sees the script, and it
# resolves every bare $NAME. A name that is neither a built-in (PROJECT_ID,
# BUILD_ID, ...) nor declared under `substitutions:` is an unmatched reference.
# Unmatched references normally error -- but a TRIGGER-invoked build sets
# ALLOW_LOOSE by default and CANNOT turn it off, and every build here is
# trigger-invoked, so an unmatched $NAME is replaced with the EMPTY STRING and
# the build runs on. A bash variable spelled $NAME therefore silently vanishes:
# `gcloud run deploy "$SERVICE" --set-env-vars="$BACKEND_ENV"` would reach
# gcloud as `gcloud run deploy "" --set-env-vars=""`. `$$NAME` escapes the pass
# and reaches bash as `$NAME`. tests/test_cloudbuild_yaml.py derives the legal
# single-$ set from `substitutions:` plus the built-in list and fails on any
# other bare $NAME, so the next variable added here cannot reintroduce this.
#
# TARGETS. Every target the plan names is implemented (bead polyglot-pdf-1s3ko
# for verify/backend-*, bead polyglot-pdf-ywxoh /4.2 for the rest): verify,
# backend-staging, backend-demo, frontend-staging, frontend-demo, editor,
# form-kits, firestore-rules, admin-service, admin-console-candidate,
# admin-console. Only `landing` remains a named-but-failing step (a
# maintainer call left open by the plan, not an oversight) -- an unknown
# target must not silently succeed either, so both cases fail loudly rather
# than being absent.

substitutions:
  # Which target to run: verify | backend-staging | backend-demo |
  # frontend-staging | frontend-demo | editor | form-kits | firestore-rules |
  # admin-service | admin-console-candidate | admin-console | landing (named,
  # not implemented -- see the TARGETS note above)
  _TARGET: verify
  # The channel whose deploy/channels/<channel>.env supplies the Cloud Run
  # env, secrets and runtime service account: staging | demo | admin.
  _CHANNEL: staging
  # The commit being built and gated. Written by the verify target, required
  # by every deploy target.
  _SHA: ''

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

timeout: 3600s

steps:
  # --------------------------------------------------------------------
  # Step 0 -- _SHA is not optional.
  #
  # An empty _SHA would make the verify target write an empty-keyed record and
  # every deploy target read it, so ONE empty-SHA verify would vouch for every
  # future empty-SHA deploy. Refuse before anything else runs.
  # --------------------------------------------------------------------
  - id: require-sha
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        if [ -z "${_SHA}" ]; then
          echo "ABORT: _SHA is empty."
          echo "Every build is gated on a specific commit: the verify target"
          echo "writes build_checks/{_SHA} and each deploy target reads it."
          echo "Pass --substitutions=_SHA=<sha> (and --sha=<sha>)."
          exit 1
        fi
        echo "Building target ${_TARGET} at ${_SHA} (channel ${_CHANNEL})."

  # --------------------------------------------------------------------
  # EVERY SITE TARGET, PLUS form-kits, must be running from a connected-repo
  # source, not a tarball build. .gcloudignore excludes frontend/,
  # schema-editor/, landing/, admin-console/ AND form-kits/ entirely, so a
  # tarball build cannot see any of those directories to build/read them --
  # and COMMIT_SHA is populated by Cloud Build ONLY when the build runs from
  # a connected repo (see cloudbuild.yaml's own header comment on _SHA vs
  # COMMIT_SHA). This is therefore the cheap, early tell: an empty
  # COMMIT_SHA on one of these targets means the source is a tarball, and
  # the build must refuse rather than silently deploy whatever stale
  # checkout happened to exist in the image. form-kits is NOT a "site"
  # target (it deploys no Hosting site) but shares the exact same failure
  # mode: a missing form-kits/ makes write_kits_manifest.py emit a valid,
  # EMPTY manifest (forms: []) and exit 0, which would overwrite the
  # DEMO's live form list with zero forms on a green build (review round:
  # bd polyglot-pdf-ywxoh).
  # --------------------------------------------------------------------
  - id: require-connected-source-for-site-targets
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        case "${_TARGET}" in
          frontend-staging|frontend-demo|editor|admin-console-candidate|admin-console|form-kits)
            ;;
          *) echo "skip (target ${_TARGET})"; exit 0 ;;
        esac
        if [ -z "$COMMIT_SHA" ]; then
          echo "ABORT: COMMIT_SHA is empty for target ${_TARGET}."
          echo "This target can only build from a connected-repo source:"
          echo ".gcloudignore excludes frontend/, schema-editor/, landing/,"
          echo "admin-console/ and form-kits/ entirely, so a tarball build"
          echo "cannot see them, and would otherwise silently deploy a"
          echo "stale/incomplete tree (or, for form-kits, an EMPTY manifest)."
          echo "Trigger this build against the 2nd-generation GitHub"
          echo "connection (scripts/setup-cloud-build.sh), not a local"
          echo "'gcloud builds submit' tarball upload."
          exit 1
        fi

  # --------------------------------------------------------------------
  # unimplemented-targets -- only `landing` remains: NOT a target (maintainer
  # call left open, per the plan). Declared and FAILING, not absent: a
  # target name that matches no step would run a build of zero steps and
  # report SUCCESS, and the admin console would record a green deploy that
  # deployed nothing.
  # --------------------------------------------------------------------

  # --------------------------------------------------------------------
  # Step 1 -- the VERIFY GATE.
  #
  # For a DEPLOY target this is the FIRST real step and it REFUSES without a
  # build_checks/{_SHA} success record. For the verify target itself it is a
  # no-op (verify is what creates the record).
  #
  # scripts/record_build_check.py fails CLOSED: a Firestore read that errors
  # refuses the deploy rather than waving it through.
  # --------------------------------------------------------------------
  - id: gate-build-checks
    # python:3.12, NOT cloud-sdk:slim. This step only needs pip and
    # google-cloud-firestore -- record_build_check.py invokes no gcloud. The
    # cloud-sdk image is Debian-based and ships PEP 668's EXTERNALLY-MANAGED
    # marker, under which a bare `pip install` into the system interpreter
    # exits non-zero ("error: externally-managed-environment"); with
    # `set -euo pipefail` that fails this step, and since this is the FIRST
    # step of every deploy target it would make the whole gate inert. An
    # official python image carries no such marker.
    name: python:3.12
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        if [ "${_TARGET}" = "verify" ]; then
          echo "Target is verify -- this build CREATES the record, nothing to gate."
          exit 0
        fi
        echo "Requiring a successful verify record for ${_SHA} ..."
        pip install --quiet google-cloud-firestore
        python scripts/record_build_check.py require \
          --sha "${_SHA}" --project "$PROJECT_ID"

  # --------------------------------------------------------------------
  # verify -- the three suites, once per SHA.
  # --------------------------------------------------------------------
  - id: verify-backend
    name: python:3.12
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        if [ "${_TARGET}" != "verify" ]; then echo "skip (target ${_TARGET})"; exit 0; fi
        pip install --quiet -r backend/requirements-dev.txt
        # -m "not external" matches CI's flaky live-Gemini exclusion (those
        # tests need real Gemini credentials the build does not have).
        #
        # NO explicit suite paths, for the same reason ci.yml passes none: a
        # bare `pytest` run from the repo root collects every root in
        # pytest.ini's `testpaths`, so a NEW top-level suite is gated here the
        # day it is declared rather than the day someone remembers to widen
        # this line. Hardcoding the roots is the regression bd
        # polyglot-pdf-3ave and bd polyglot-pdf-pnoik both shipped, and it is
        # worse here than in CI: this step is what writes build_checks/{sha},
        # the record every deploy target reads as "this commit's suites
        # passed".
        python -m pytest -q -m "not external"

  - id: verify-frontend
    name: node:22
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        if [ "${_TARGET}" != "verify" ]; then echo "skip (target ${_TARGET})"; exit 0; fi
        # `npm run test:run` (vitest run), NEVER `npm test`, and `typecheck`
        # alongside it -- both to match .github/workflows/ci.yml exactly.
        # `npm test` maps to bare `vitest`, whose watch mode resolves to
        # `!isCI && process.stdin.isTTY`: a build step has no TTY, so it
        # happens not to hang TODAY, but that is an accident of the runner
        # rather than a property of the command, and a hung verify blocks
        # every deploy for that SHA until the 3600s timeout. typecheck is not
        # optional either: build_checks/{_SHA} MEANS "this commit's suites
        # passed", and without `tsc --noEmit` a commit CI would reject still
        # earns a success record (bd polyglot-pdf-1rgr, polyglot-pdf-b6943).
        cd frontend && npm ci && npm run typecheck && npm run test:run

  - id: verify-admin-console
    name: node:22
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        if [ "${_TARGET}" != "verify" ]; then echo "skip (target ${_TARGET})"; exit 0; fi
        # Same as the frontend step: ci.yml's commands, not their watch-mode
        # siblings. See the comment in verify-frontend.
        cd admin-console && npm ci && npm run typecheck && npm run test:run

  - id: record-build-check
    # python:3.12 for the same reason as gate-build-checks above: pip plus
    # google-cloud-firestore, no gcloud, and no PEP 668 marker in the way.
    name: python:3.12
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        if [ "${_TARGET}" != "verify" ]; then echo "skip (target ${_TARGET})"; exit 0; fi
        pip install --quiet google-cloud-firestore
        python scripts/record_build_check.py record \
          --sha "${_SHA}" --status success --build-id "$BUILD_ID" \
          --project "$PROJECT_ID"

  # --------------------------------------------------------------------
  # backend-<channel> -- docker build + push, then gcloud run deploy with the
  # env/secrets/SA read from deploy/channels/${_CHANNEL}.env.
  #
  # This is the ONLY place a public backend is deployed: deploy-staging.sh and
  # deploy-demo.sh run this target rather than deploying anything themselves.
  # The channel file is the one source of the env/secrets/SA it reads, which
  # is the point of keeping that config out of bash (bd polyglot-pdf-1s3ko).
  # --------------------------------------------------------------------
  - id: staging-verified-gate
    # THE STAGING-BEFORE-DEMO GATE (plan: "The staging-before-demo gate lives
    # IN THE BUILD, not only on the admin route"). The three demo-side targets
    # -- backend-demo, frontend-demo, and admin-service's traffic shift --
    # each refuse to proceed without a `deployments` record showing a
    # successful STAGING deploy for the same target family and SHA. A
    # bash-triggered build therefore cannot bypass this any more than an
    # admin-console-triggered one can; the admin route's own check (bead 4.4)
    # is an earlier, friendlier refusal, not the only one.
    #
    # admin-service is NOT case-matched below -- it falls into the `*) skip`
    # arm here. "demo-side" for the admin service means the TRAFFIC-SHIFT
    # half of its target, not the tagged candidate deploy, and admin-service
    # has its own staging tier (verify the tagged revision, then shift)
    # independent of this gate, so it does not need this generic gate too.
    # Its actual demo-side gating is the SEPARATE admin-service-staging-gate
    # step below, which calls the same promotion_gate.py module with family
    # "admin-service" -- do not assume removing/refactoring that step is safe
    # because this step "already covers it"; it does not.
    name: python:3.12
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        # TGT is a real bash variable holding the substitution value --
        # a bare "$${_TARGET%-demo}" is a no-op suffix-strip on the literal
        # token "_TARGET" (nothing ever assigns that name), which crashes
        # under set -u with "_TARGET: unbound variable" on every
        # backend-demo/frontend-demo build (review round: bd
        # polyglot-pdf-ywxoh). Assigning TGT first, then stripping the
        # suffix off TGT, fixes it -- every other "${_TARGET}" in this
        # file is fine as-is because those uses never shell-strip it.
        TGT="${_TARGET}"
        case "$$TGT" in
          backend-demo|frontend-demo) TARGET_FAMILY="$${TGT%-demo}" ;;
          *) echo "skip (target ${_TARGET})"; exit 0 ;;
        esac
        pip install --quiet google-cloud-firestore
        python scripts/promotion_gate.py \
          --target-family "$$TARGET_FAMILY" --sha "${_SHA}" --project "$PROJECT_ID"

  # --------------------------------------------------------------------
  # frontend-<channel> -- resolve the live backend + admin URLs, build, and
  # deploy to the channel's Hosting target. Exactly what deploy-all.sh's
  # FRONTEND stage does today (npm ci && npm run build:<mode>, then
  # `firebase deploy --only hosting:<target>`), reading the same channel file
  # for which Hosting target and build mode apply.
  # --------------------------------------------------------------------
  - id: backend-build-image
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        case "${_TARGET}" in backend-*) ;; *) echo "skip (target ${_TARGET})"; exit 0 ;; esac
        docker build -t "gcr.io/$PROJECT_ID/polyglot-backend:${_SHA}" .
        docker push "gcr.io/$PROJECT_ID/polyglot-backend:${_SHA}"

  - id: backend-deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        case "${_TARGET}" in backend-*) ;; *) echo "skip (target ${_TARGET})"; exit 0 ;; esac

        CHANNEL_FILE="deploy/channels/${_CHANNEL}.env"
        # deploy-all.sh's own parser, sourced rather than reimplemented: a
        # second copy of the format is the drift the channel files exist to
        # end. Sourcing stops before the deploy flow (that script guards on
        # BASH_SOURCE), so only the helper functions are defined.
        source ./deploy-all.sh
        CHANNEL_ENV=$(read_channel_section "$$CHANNEL_FILE" SET_ENV_VARS)
        CHANNEL_SECRETS=$(read_channel_section "$$CHANNEL_FILE" SET_SECRETS)
        CHANNEL_SA=$(read_channel_value "$$CHANNEL_FILE" SERVICE_ACCOUNT SERVICE_ACCOUNT)

        # The empty-section refusal, for the reason the channel files exist:
        # --set-env-vars REPLACES the service's whole env block, so a channel
        # file with an empty [SET_ENV_VARS] would deploy the computed defaults
        # alone -- every VERTEXAI, LINK_* and CORS_EXTRA_ORIGINS setting
        # stripped off the running service. The missing-FILE case already
        # aborts (read_channel_section exits 1 and set -e propagates it); this
        # is the empty-SECTION case, which otherwise exits 0 with a trailing
        # comma. One source, two consumers: the guard has to travel with it.
        if [ -z "$$CHANNEL_ENV" ]; then
          echo "ABORT: $$CHANNEL_FILE has no [SET_ENV_VARS] entries."
          echo "--set-env-vars REPLACES the service's whole env block, so"
          echo "deploying from an empty channel file would strip every setting."
          exit 1
        fi

        case "${_CHANNEL}" in
          staging) SERVICE="polyglot-backend-staging" ;;
          demo)    SERVICE="polyglot-backend" ;;
          *) echo "ABORT: backend target has no service for channel ${_CHANNEL}"; exit 1 ;;
        esac

        # The computed keys -- everything that cannot be a literal in a
        # channel file. GIT_SHA=${_SHA} is the commit this build ran at, which
        # is what GET /version reports, and APP_MODULE selects the ASGI app
        # inside the one shared image (Surface contract 12). The public
        # backends take APP_MODULE literally here; only admin.env declares it.
        BACKEND_ENV="GOOGLE_CLOUD_PROJECT=$PROJECT_ID,FORM_KITS_MODE=gcs"
        BACKEND_ENV="$$BACKEND_ENV,FORM_KITS_GCS_BUCKET=$PROJECT_ID-form-kits"
        BACKEND_ENV="$$BACKEND_ENV,FORM_KITS_REMOTE_PREFIX=form-kits"
        BACKEND_ENV="$$BACKEND_ENV,CONFIRMATION_FIRESTORE_ENABLED=true"
        BACKEND_ENV="$$BACKEND_ENV,FIRMS_FIRESTORE_ENABLED=true"
        BACKEND_ENV="$$BACKEND_ENV,APP_MODULE=backend.main:app,GIT_SHA=${_SHA}"
        BACKEND_ENV="$$BACKEND_ENV,$$CHANNEL_ENV"

        SECRETS_FLAG=()
        [ -n "$$CHANNEL_SECRETS" ] && SECRETS_FLAG=(--set-secrets "$$CHANNEL_SECRETS")
        SA_FLAG=()
        [ -n "$$CHANNEL_SA" ] && SA_FLAG=(--service-account "$$CHANNEL_SA")

        gcloud run deploy "$$SERVICE" \
          --image "gcr.io/$PROJECT_ID/polyglot-backend:${_SHA}" \
          --region us-central1 \
          --platform managed \
          --allow-unauthenticated \
          --timeout=3600 \
          --memory=1Gi \
          --max-instances=10 \
          --project "$PROJECT_ID" \
          --set-env-vars="$$BACKEND_ENV" \
          "$${SA_FLAG[@]}" \
          "$${SECRETS_FLAG[@]}"

  - id: backend-reachability-gate
    # cloud-sdk:slim, NOT python:3.12 -- scripts/verify_service_reachable.py
    # has no third-party dependency (stdlib only), but its default
    # gcloud_runner shells out to the `gcloud` BINARY, which python:3.12 does
    # not ship. cloud-sdk:slim bundles its own python3 for gcloud's internal
    # use, which is enough to run this stdlib-only module.
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        case "${_TARGET}" in backend-*) ;; *) echo "skip (target ${_TARGET})"; exit 0 ;; esac
        case "${_CHANNEL}" in
          staging) SERVICE="polyglot-backend-staging" ;;
          demo)    SERVICE="polyglot-backend" ;;
          *) echo "ABORT: no service for channel ${_CHANNEL}"; exit 1 ;;
        esac
        # --allow-unauthenticated only REQUESTS the public invoker binding; the
        # request can be refused while the deploy still exits 0, leaving a
        # service that 403s every request before the app sees it (bd
        # polyglot-pdf-pidtg). scripts/verify_service_reachable.py is the ONE
        # port of this check (bd polyglot-pdf-ywxoh, 4.2) -- bash and the
        # build both call it now instead of each carrying their own copy.
        python3 scripts/verify_service_reachable.py \
          "$$SERVICE" us-central1 "$PROJECT_ID" --severity fatal


  - id: backend-record-deployment
    # Staging's own success row, same reasoning as frontend-record-deployment
    # below: avoids racing bead 4.3's Pub/Sub webhook, and covers
    # bash-triggered builds the webhook alone would still need this for.
    # backend-demo does NOT record here -- only STAGING targets write their
    # own success row; a demo deploy's own success is not itself something
    # any future promotion decision reads.
    name: python:3.12
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        if [ "${_TARGET}" != "backend-staging" ]; then echo "skip (target ${_TARGET})"; exit 0; fi
        pip install --quiet google-cloud-firestore
        python scripts/record_deployment.py \
          --target backend-staging --channel staging --sha "${_SHA}" \
          --build-id "$BUILD_ID" --status success --project "$PROJECT_ID"
  - id: frontend-resolve-urls
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        case "${_TARGET}" in frontend-*) ;; *) echo "skip (target ${_TARGET})"; exit 0 ;; esac
        case "${_CHANNEL}" in
          staging) BACKEND_SERVICE="polyglot-backend-staging" ;;
          demo)    BACKEND_SERVICE="polyglot-backend" ;;
          *) echo "ABORT: no backend service for channel ${_CHANNEL}"; exit 1 ;;
        esac
        # VITE_WS_URL / VITE_ADMIN_API_BASE_URL are fixed at TRIGGER time as
        # substitutions would be, so they are resolved here (an earlier step
        # in the SAME build) and handed forward through /workspace for the
        # build step to export, matching deploy-all.sh's own live-URL
        # injection (bd polyglot-pdf-emm7 / z4ljj) rather than trusting a
        # committed .env literal.
        BACKEND_URL=$(gcloud run services describe "$$BACKEND_SERVICE" \
          --platform managed --region us-central1 --project "$PROJECT_ID" \
          --format 'value(status.url)' 2>/dev/null || true)
        ADMIN_URL=$(gcloud run services describe polyglot-admin \
          --platform managed --region us-central1 --project "$PROJECT_ID" \
          --format 'value(status.url)' 2>/dev/null || true)
        if [ -z "$$BACKEND_URL" ]; then
          echo "ABORT: could not resolve the Cloud Run URL for $$BACKEND_SERVICE."
          echo "Refusing to build: an unresolved backend means the fallback"
          echo "VITE_WS_URL in .env.<mode> would point at a DIFFERENT channel's"
          echo "backend -- deploy that service first."
          exit 1
        fi
        # Same refusal for the admin service, matching
        # deploy-all.sh:885-892 -- _CHANNEL is ALWAYS an explicit channel
        # here (staging or demo, never "unset"), so this target is always
        # in the branch that script aborts under. Falling back silently
        # would leave VITE_ADMIN_API_BASE_URL unexported, and
        # frontend-build-deploy exports whatever this step writes
        # UNCONDITIONALLY -- an empty export overrides the committed
        # frontend/.env.demo fallback rather than deferring to it, so a
        # silent skip here would ship a build whose firm-console calls
        # become relative paths routed by Hosting's /api/** rewrite to
        # the VOICE backend, not the admin service.
        if [ -z "$$ADMIN_URL" ]; then
          echo "ABORT: could not resolve the Cloud Run URL for polyglot-admin."
          echo "Refusing to build: an unresolved admin service means"
          echo "VITE_ADMIN_API_BASE_URL would go out empty, and firm-console"
          echo "calls would be routed to the voice backend instead --"
          echo "deploy that service first (e.g. ./deploy-admin.sh)."
          exit 1
        fi
        echo "$${BACKEND_URL/https:/wss:}/ws/fill" > /workspace/.vite_ws_url
        echo "$$ADMIN_URL" > /workspace/.vite_admin_api_base_url

  - id: frontend-build-deploy
    name: node:22
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        case "${_TARGET}" in frontend-*) ;; *) echo "skip (target ${_TARGET})"; exit 0 ;; esac
        case "${_CHANNEL}" in
          staging) HOSTING_TARGET="app-staging" ;;
          demo)    HOSTING_TARGET="app" ;;
          *) echo "ABORT: no Hosting target for channel ${_CHANNEL}"; exit 1 ;;
        esac
        export VITE_WS_URL=$(cat /workspace/.vite_ws_url)
        # VITE_APP_CHANNEL (bd polyglot-pdf-z4ljj, C0): both channels build
        # the SAME Vite mode (build:schema:demo below), so import.meta.env.MODE
        # cannot tell them apart -- this is the one thing that can, and
        # frontend/src/shared/config.ts::getAppChannel() falls back to 'demo'
        # when it is unset. deploy-staging.sh and deploy-demo.sh both export
        # this explicitly before calling deploy-all.sh; a staging build that
        # never sets it would silently claim to be the demo channel on every
        # firm-scoped admin-service call (?channel=demo), reading and writing
        # the DEMO's Firestore data from the staging site.
        export VITE_APP_CHANNEL="${_CHANNEL}"
        RESOLVED_ADMIN_API_BASE_URL=$(cat /workspace/.vite_admin_api_base_url 2>/dev/null || true)
        if [ -n "$$RESOLVED_ADMIN_API_BASE_URL" ]; then
          export VITE_ADMIN_API_BASE_URL="$$RESOLVED_ADMIN_API_BASE_URL"
        else
          echo "WARN: could not resolve live admin service URL; build falls back to VITE_ADMIN_API_BASE_URL in .env.<mode>" >&2
        fi
        cd frontend
        npm ci
        # build:schema:demo for BOTH channels, deliberately. There is no
        # separate build:schema:staging script; the staging channel has
        # always built the SAME demo-mode bundle (see
        # docs/components/config-deployment.md) -- only the injected
        # VITE_WS_URL and Hosting target differ per channel, both already
        # resolved above.
        npm run build:schema:demo
        cd ..
        npx firebase-tools deploy --only "hosting:$$HOSTING_TARGET" --project "$PROJECT_ID"

  - id: frontend-record-deployment
    # Staging's own success row (plan: "each staging target's LAST step
    # writes its own success row to deployments" -- avoids racing bead 4.3's
    # Pub/Sub webhook, and covers bash-triggered builds the webhook alone
    # would still record but which the promotion gate needs available NOW).
    name: python:3.12
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        if [ "${_TARGET}" != "frontend-staging" ]; then echo "skip (target ${_TARGET})"; exit 0; fi
        pip install --quiet google-cloud-firestore
        python scripts/record_deployment.py \
          --target frontend-staging --channel staging --sha "${_SHA}" \
          --build-id "$BUILD_ID" --status success --project "$PROJECT_ID"

  # --------------------------------------------------------------------
  # editor -- the hosted schema editor. Mirrors deploy-editor.sh: resolve the
  # live PUBLIC backend URL (warn-mode; that backend is pre-existing from
  # this target's point of view), build in hosted mode, deploy hosting:editor.
  # --------------------------------------------------------------------
  - id: editor-resolve-url
    # A SEPARATE cloud-sdk step, not inlined into editor-build-deploy: that
    # step runs on node:22, which has no gcloud binary. Resolved here and
    # handed forward through /workspace, same pattern as frontend-resolve-urls.
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        if [ "${_TARGET}" != "editor" ]; then echo "skip (target ${_TARGET})"; exit 0; fi
        gcloud run services describe polyglot-backend \
          --platform managed --region us-central1 --project "$PROJECT_ID" \
          --format 'value(status.url)' 2>/dev/null > /workspace/.vite_api_base_url || true

  - id: editor-build-deploy
    name: node:22
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        if [ "${_TARGET}" != "editor" ]; then echo "skip (target ${_TARGET})"; exit 0; fi
        RESOLVED_BACKEND_URL=$(cat /workspace/.vite_api_base_url 2>/dev/null || true)
        if [ -n "$$RESOLVED_BACKEND_URL" ]; then
          export VITE_API_BASE_URL="$$RESOLVED_BACKEND_URL"
        else
          echo "WARN: could not resolve live backend URL; build falls back to VITE_API_BASE_URL in .env.hosted" >&2
        fi
        cd schema-editor
        npm ci
        npm run build:hosted
        cd ..
        npx firebase-tools deploy --only hosting:editor --project "$PROJECT_ID"

  - id: editor-reachability-warn
    # WARN-mode only, same reasoning as deploy-editor.sh: the backend is
    # PRE-EXISTING from this target's point of view, so refusing to ship the
    # editor over its IAM state would be the gate crying wolf. cloud-sdk, not
    # python:3.12 -- see backend-reachability-gate's note on why.
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        if [ "${_TARGET}" != "editor" ]; then echo "skip (target ${_TARGET})"; exit 0; fi
        python3 scripts/verify_service_reachable.py \
          polyglot-backend us-central1 "$PROJECT_ID" --severity warn || true

  # --------------------------------------------------------------------
  # form-kits -- the status-complete kit upload plus the validated
  # index.json, ported to scripts/write_kits_manifest.py so this target and
  # deploy-all.sh's --form-kits stage share ONE implementation (bd
  # polyglot-pdf-ywxoh, 4.2). NOTE: this publishes to the DEMO's form list
  # regardless of which channel invoked it (the bucket has no per-channel
  # split today) -- treat it as a demo action whatever _CHANNEL was passed.
  # --------------------------------------------------------------------
  - id: form-kits-upload
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        if [ "${_TARGET}" != "form-kits" ]; then echo "skip (target ${_TARGET})"; exit 0; fi
        BUCKET="$PROJECT_ID-form-kits"
        PREFIX="form-kits"
        for kit_dir in form-kits/*/; do
          [ -d "$$kit_dir" ] || continue
          kit_id=$(basename "$$kit_dir")
          case "$$kit_id" in _*) continue ;; esac
          meta="$$kit_dir/metadata.json"
          [ -f "$$meta" ] || continue
          grep -Eq '"status"[[:space:]]*:[[:space:]]*"complete"' "$$meta" || continue
          # Publishable children only -- skip _archive/_drafts rings
          # (bd polyglot-pdf-06u5o), matching deploy-all.sh's
          # collect_publishable_kit_files.
          files=()
          for entry in "$$kit_dir"*; do
            [ -e "$$entry" ] || continue
            base=$(basename "$$entry")
            case "$$base" in _*) continue ;; esac
            files+=("$$entry")
          done
          [ $${#files[@]} -eq 0 ] && continue
          gcloud storage cp -r "$${files[@]}" "gs://$$BUCKET/$$PREFIX/$$kit_id/" --project "$PROJECT_ID"
        done

  - id: form-kits-manifest
    name: python:3.12
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        if [ "${_TARGET}" != "form-kits" ]; then echo "skip (target ${_TARGET})"; exit 0; fi
        python scripts/write_kits_manifest.py \
          --form-kits-dir form-kits --prefix form-kits --out /workspace/index.json
        cat /workspace/index.json

  - id: form-kits-manifest-upload
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        if [ "${_TARGET}" != "form-kits" ]; then echo "skip (target ${_TARGET})"; exit 0; fi
        gcloud storage cp /workspace/index.json \
          "gs://$PROJECT_ID-form-kits/form-kits/index.json" --project "$PROJECT_ID"

  # --------------------------------------------------------------------
  # firestore-rules -- project-wide, so this is always a demo action
  # regardless of _CHANNEL, same note as form-kits above.
  # --------------------------------------------------------------------
  - id: firestore-rules-deploy
    # node:22, NOT cloud-sdk:slim: this step's only tool is `npx
    # firebase-tools`, and cloud-sdk:slim is gcloud + Debian + Python only --
    # it ships no Node/npx at all, so `npx` fails outright with "command not
    # found" on that image (review round: bd polyglot-pdf-ywxoh; every other
    # npx/npm step in this file -- verify-frontend, verify-admin-console,
    # frontend-build-deploy, editor-build-deploy, admin-console-build-deploy
    # -- already runs on node:22). No gcloud call is needed here (firebase
    # deploy authenticates through the build SA's ADC the same as every
    # other firebase-tools step), so unlike admin-console-resolve-url this
    # needs no separate cloud-sdk step to split gcloud out.
    name: node:22
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        if [ "${_TARGET}" != "firestore-rules" ]; then echo "skip (target ${_TARGET})"; exit 0; fi
        npx --yes firebase-tools deploy --only firestore:rules --project "$PROJECT_ID"
        # COMPOSITE INDEXES SHIP WITH THE RULES (firestore.indexes.json, wired
        # via firebase.json). deploy-demo.sh deployed both, as two stages, for
        # as long as it had a Firestore stage at all; when that script became
        # a thin wrapper (bd polyglot-pdf-oqtm7) this target became the only
        # path that ships either, so dropping indexes here would silently
        # retire them. A Firestore query combining an equality filter with an
        # order_by on a DIFFERENT field is served ONLY from a composite index
        # -- without one it fails at runtime with FAILED_PRECONDITION, and no
        # local test catches it because a fake query object filters and sorts
        # in Python (CLAUDE.md scar #7, applied to indexes rather than IAM).
        # GET /admin/audit emits exactly that shape for each of its four
        # filters. Index builds are ASYNCHRONOUS: this command returns before
        # a new index is READY, so a freshly added filter can still fail for a
        # few minutes after the build reports success.
        #
        # NO --force, deliberately. An index that exists in the project but
        # not in firestore.indexes.json makes firebase-tools ask whether to
        # DELETE it; --force answers yes, which would let a build silently
        # drop an index someone added in the console. Without it the command
        # simply fails in a non-interactive environment, and a build that
        # stops and says so is the safe direction -- a missing index is a
        # runtime FAILED_PRECONDITION, but a deleted one is worse and is not
        # something a deploy should decide on its own.
        npx --yes firebase-tools deploy --only firestore:indexes --project "$PROJECT_ID"

  # --------------------------------------------------------------------
  # admin-service -- tagged no-traffic revision, verified at its own stable
  # tag URL, THEN traffic shift. This IS the admin deploy sequence;
  # deploy-admin.sh only runs this target.
  # There is ONE admin service backing BOTH channels' data, so this is its
  # own staging tier independent of the backend-staging/demo split -- see
  # the plan's "Admin-tier targets" note.
  #
  # The docker build/push is its OWN step on gcr.io/cloud-builders/docker
  # (the dedicated image that ships the Docker CLI), mirroring
  # backend-build-image above -- gcr.io/google.com/cloudsdktool/cloud-sdk:slim
  # (used by every other admin-service step here) does not bundle `docker`.
  # --------------------------------------------------------------------
  - id: admin-service-build-image
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        if [ "${_TARGET}" != "admin-service" ]; then echo "skip (target ${_TARGET})"; exit 0; fi
        docker build -t "gcr.io/$PROJECT_ID/polyglot-backend:${_SHA}" .
        docker push "gcr.io/$PROJECT_ID/polyglot-backend:${_SHA}"

  - id: admin-service-deploy-tagged
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        if [ "${_TARGET}" != "admin-service" ]; then echo "skip (target ${_TARGET})"; exit 0; fi
        CHANNEL_FILE="deploy/channels/admin.env"
        source ./deploy-all.sh
        CHANNEL_ENV=$(read_channel_section "$$CHANNEL_FILE" SET_ENV_VARS)
        CHANNEL_SECRETS=$(read_channel_section "$$CHANNEL_FILE" SET_SECRETS)
        CHANNEL_SA=$(read_channel_value "$$CHANNEL_FILE" SERVICE_ACCOUNT SERVICE_ACCOUNT)
        if [ -z "$$CHANNEL_ENV" ]; then
          echo "ABORT: $$CHANNEL_FILE has no [SET_ENV_VARS] entries."
          exit 1
        fi
        # ADMIN_SERVICE_URL and BACKEND_URLS_JSON are DELIBERATELY not in
        # admin.env (its own [SET_ENV_VARS] comment) -- Google assigns the
        # admin service's own URL only at first deploy, and the admin
        # service has no channel of its own so it cannot derive either
        # public backend's URL the way a channel derives its sibling's.
        # This step resolves all three live and appends them below;
        # --set-env-vars REPLACES the service's entire env block, so omitting
        # them here would silently wipe the refund sweep's OIDC audience and
        # blank GET /admin/health's channel fan-out on every admin-service
        # deploy (review round: bd polyglot-pdf-ywxoh). This is the only
        # copy of that resolution -- deploy-admin.sh is a thin trigger
        # wrapper. "2>/dev/null || true" makes a not-yet-deployed service
        # resolve to empty rather than aborting (set -e), which is the
        # first-deploy case.
        ADMIN_SERVICE_URL=$(gcloud run services describe polyglot-admin \
          --platform managed --region us-central1 --project "$PROJECT_ID" \
          --format 'value(status.url)' 2>/dev/null || true)
        LIVE_ENV="$$CHANNEL_ENV"
        [ -n "$$ADMIN_SERVICE_URL" ] && LIVE_ENV="$$LIVE_ENV,ADMIN_SERVICE_URL=$$ADMIN_SERVICE_URL"
        BACKEND_URLS_PARTS=""
        DEMO_BACKEND_URL=$(gcloud run services describe polyglot-backend \
          --platform managed --region us-central1 --project "$PROJECT_ID" \
          --format 'value(status.url)' 2>/dev/null || true)
        [ -n "$$DEMO_BACKEND_URL" ] && BACKEND_URLS_PARTS="demo=$$DEMO_BACKEND_URL"
        STAGING_BACKEND_URL=$(gcloud run services describe polyglot-backend-staging \
          --platform managed --region us-central1 --project "$PROJECT_ID" \
          --format 'value(status.url)' 2>/dev/null || true)
        if [ -n "$$STAGING_BACKEND_URL" ]; then
          if [ -n "$$BACKEND_URLS_PARTS" ]; then
            BACKEND_URLS_PARTS="$$BACKEND_URLS_PARTS;staging=$$STAGING_BACKEND_URL"
          else
            BACKEND_URLS_PARTS="staging=$$STAGING_BACKEND_URL"
          fi
        fi
        LIVE_ENV="$$LIVE_ENV,BACKEND_URLS_JSON=$$BACKEND_URLS_PARTS"
        # admin.env's [SET_ENV_VARS] carries only APP_MODULE,
        # CORS_EXTRA_ORIGINS and SWEEP_SCHEDULER_SA_EMAIL -- FORM_KITS_MODE,
        # FORM_KITS_GCS_BUCKET and FORM_KITS_REMOTE_PREFIX are computed here
        # exactly as backend-deploy computes them, not read from the channel
        # file. Without them get_form_kit_store() (backend/services/
        # form_kits.py) falls back to FORM_KITS_MODE's "local" default and
        # GET /admin/kits silently returns an empty list on a green build
        # (review round: bd polyglot-pdf-ywxoh).
        BACKEND_ENV="GOOGLE_CLOUD_PROJECT=$PROJECT_ID,FORM_KITS_MODE=gcs"
        BACKEND_ENV="$$BACKEND_ENV,FORM_KITS_GCS_BUCKET=$PROJECT_ID-form-kits"
        BACKEND_ENV="$$BACKEND_ENV,FORM_KITS_REMOTE_PREFIX=form-kits"
        BACKEND_ENV="$$BACKEND_ENV,GIT_SHA=${_SHA}"
        BACKEND_ENV="$$BACKEND_ENV,$$LIVE_ENV"
        SECRETS_FLAG=()
        [ -n "$$CHANNEL_SECRETS" ] && SECRETS_FLAG=(--set-secrets "$$CHANNEL_SECRETS")
        SA_FLAG=()
        [ -n "$$CHANNEL_SA" ] && SA_FLAG=(--service-account "$$CHANNEL_SA")
        gcloud run deploy polyglot-admin \
          --image "gcr.io/$PROJECT_ID/polyglot-backend:${_SHA}" \
          --region us-central1 --platform managed --allow-unauthenticated \
          --timeout=3600 --memory=1Gi --max-instances=3 --project "$PROJECT_ID" \
          --set-env-vars="$$BACKEND_ENV" \
          --no-traffic --tag candidate \
          "$${SA_FLAG[@]}" "$${SECRETS_FLAG[@]}"

  - id: admin-service-verify-tagged
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        if [ "${_TARGET}" != "admin-service" ]; then echo "skip (target ${_TARGET})"; exit 0; fi
        BASE_URL=$(gcloud run services describe polyglot-admin \
          --platform managed --region us-central1 --project "$PROJECT_ID" \
          --format 'value(status.url)')
        TAG_URL=$(echo "$$BASE_URL" | sed -E "s#https://#https://candidate---#")
        HEALTH_STATUS=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$$TAG_URL/health" || echo "000")
        if [ "$$HEALTH_STATUS" != "200" ]; then
          echo "ABORT: the tagged candidate revision did not answer /health ($$HEALTH_STATUS)."
          echo "Traffic was NOT shifted -- the previous revision is still live."
          exit 1
        fi
        echo "Tagged candidate is healthy at $$TAG_URL"

  - id: admin-service-record-deployment
    # admin-service has NO separate staging target of its own (deploy-admin.sh:
    # "the admin service has no channel of its own" -- ONE service backs both
    # channels' data, see deploy-admin.sh's own "WHY A TAGGED NO-TRAFFIC
    # DEPLOY" comment). Its tagged-candidate-then-shift sequence above IS its
    # staging tier: a healthy /health response from the untrafficked
    # "candidate" tag (admin-service-verify-tagged, just above) is the same
    # proof-of-work a separate staging deploy provides for backend/frontend.
    # So this step records that proof as a channel="staging" row --
    # hardcoded, like its backend-record-deployment / frontend-record-deployment
    # siblings, NOT "${_CHANNEL}" (which resolves to "admin" per
    # setup-cloud-build.sh's trigger wiring and would make
    # admin-service-staging-gate below permanently unsatisfiable: the gate
    # requires channel=="staging" and no other step ever writes that value
    # for this family).
    #
    # ORDER MATTERS: this step MUST run BEFORE admin-service-staging-gate,
    # unlike backend/frontend where the recording target and the gated
    # target are two SEPARATE builds. Here both halves are the SAME build,
    # so the row has to exist before the gate reads it -- recording after
    # the gate (as originally written) is a bootstrap deadlock: no build
    # could ever satisfy its own gate.
    name: python:3.12
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        if [ "${_TARGET}" != "admin-service" ]; then echo "skip (target ${_TARGET})"; exit 0; fi
        pip install --quiet google-cloud-firestore
        python scripts/record_deployment.py \
          --target admin-service --channel staging --sha "${_SHA}" \
          --build-id "$BUILD_ID" --status success --project "$PROJECT_ID"

  - id: admin-service-staging-gate
    # The staging-before-demo gate for the admin service's TRAFFIC SHIFT
    # (plan: "backend-demo, frontend-demo and admin-service traffic shift
    # additionally require a deployments record ..."). Uses the SAME
    # promotion gate module as staging-verified-gate above, family
    # "admin-service". Satisfied by admin-service-record-deployment just
    # above, in THIS SAME build -- see that step's comment for why its
    # position is reversed relative to backend/frontend's separate-build
    # staging tiers.
    name: python:3.12
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        if [ "${_TARGET}" != "admin-service" ]; then echo "skip (target ${_TARGET})"; exit 0; fi
        pip install --quiet google-cloud-firestore
        python scripts/promotion_gate.py \
          --target-family admin-service --sha "${_SHA}" --project "$PROJECT_ID"

  - id: admin-service-shift-traffic
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        if [ "${_TARGET}" != "admin-service" ]; then echo "skip (target ${_TARGET})"; exit 0; fi
        gcloud run services update-traffic polyglot-admin \
          --region us-central1 --project "$PROJECT_ID" --to-latest

  # --------------------------------------------------------------------
  # admin-console-candidate / admin-console -- the two Hosting sites, mirrors
  # deploy-admin-console.sh's candidate-then-live sequence (each is its own
  # target/build rather than a --live flag, since the build has no
  # interactive "run this again with --live" step).
  # --------------------------------------------------------------------
  - id: admin-console-resolve-url
    # A SEPARATE cloud-sdk step: admin-console-build-deploy runs on node:22,
    # which has no gcloud binary. Same /workspace hand-off pattern as
    # frontend-resolve-urls / editor-resolve-url.
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        case "${_TARGET}" in
          admin-console-candidate|admin-console) ;;
          *) echo "skip (target ${_TARGET})"; exit 0 ;;
        esac
        gcloud run services describe polyglot-admin \
          --platform managed --region us-central1 --project "$PROJECT_ID" \
          --format 'value(status.url)' 2>/dev/null > /workspace/.vite_admin_api_base_url || true

  - id: admin-console-build-deploy
    name: node:22
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        case "${_TARGET}" in
          admin-console-candidate) HOSTING_TARGET="admin-candidate" ;;
          admin-console)           HOSTING_TARGET="admin" ;;
          *) echo "skip (target ${_TARGET})"; exit 0 ;;
        esac
        RESOLVED_ADMIN_URL=$(cat /workspace/.vite_admin_api_base_url 2>/dev/null || true)
        if [ -n "$$RESOLVED_ADMIN_URL" ]; then
          export VITE_ADMIN_API_BASE_URL="$$RESOLVED_ADMIN_URL"
        else
          echo "WARN: could not resolve live admin service URL; build falls back to .env.hosted" >&2
        fi
        cd admin-console
        npm ci
        npm run build:hosted
        cd ..
        npx firebase-tools deploy --only "hosting:$$HOSTING_TARGET" --project "$PROJECT_ID"

  - id: admin-console-reachability-warn
    # cloud-sdk, not python:3.12 -- see backend-reachability-gate's note.
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        case "${_TARGET}" in
          admin-console-candidate|admin-console) ;;
          *) echo "skip (target ${_TARGET})"; exit 0 ;;
        esac
        python3 scripts/verify_service_reachable.py \
          polyglot-admin us-central1 "$PROJECT_ID" --severity warn || true
  - id: unimplemented-targets
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        case "${_TARGET}" in
          verify|backend-staging|backend-demo|frontend-staging|frontend-demo|editor|form-kits|firestore-rules|admin-service|admin-console-candidate|admin-console)
            echo "target ${_TARGET} is implemented"
            exit 0
            ;;
          landing)
            echo "target not implemented"
            exit 1
            ;;
          *)
            echo "ABORT: unknown target ${_TARGET}"
            exit 1
            ;;
        esac
