# Weekly, grouped dependency updates (sprint 23, bd polyglot-pdf-ikdnd).
# Informational like ci.yml: a Dependabot PR still goes through the normal
# review + merge gate; nothing here auto-merges.
#
# The five deploy-sensitive backend packages below are excluded from the
# all-pip-backend group (bd polyglot-pdf-lwka0): two grouped batches in a row
# (#816/#817/#819/#822, reverted by #830; #865, reverted the same day) broke
# dev's BUILD after landing -- never a deployed environment (#830's own
# revert body says "dev does not build"; the backend pins contradicted each
# other so pip install itself failed with ResolutionImpossible) -- because
# the unit suites never exercise what a bump of these changes (every test CI runs (-m "not external") stubs the Gemini SDK, none starts uvicorn or the websockets library, and FastAPI/Starlette run only in-process (TestClient or httpx.ASGITransport), never under a real ASGI server), so a real bump cannot be validated by the suite. Every one of those PRs was
# actually RED in the job that mattered (e.g. #865 failed backend pytest,
# unresolvable on websockets==17.1) and was merged by hand anyway -- CI
# caught these, but CI here is advisory (see docs/standards/testing.md), not
# a merge gate, so a red PR going in is a separate, still-open process gap
# (bd polyglot-pdf-9ywia). This exclusion stops the bump from being proposed
# at all; it does not depend on CI being green in the first place.
#   - google-genai: the Live adapter (backend/adapters/live_ai_gemini.py) is
#     written against the vendored docs/genai_docs 2.8 reference; every test
#     CI runs (-m "not external") stubs the SDK.
#   - websockets, uvicorn: the /ws/fill handshake broke on a websockets bump
#     before (see docs/components/websocket-routing.md).
#   - fastapi, starlette: #865 was a major-version jump (0.48 -> 1.6) that
#     the in-process TestClient could not tell from the old one (no test
#     runs a real ASGI server).
# A bump of any of these five must go through a deliberate bead: run the voice harness on the LOCAL stack with the new pins (it only runs against localhost), deploy to staging, and do a manual voice test-drive there before any demo deploy
# (see docs/doctrine/promotion-tiers.md) -- never through an automatic grouped PR.
# The ignore: entries below (no versions: key means "ignore every version")
# are what actually stop Dependabot from opening a PR for these packages; the
# exclude-patterns: entry keeps them out of the all-pip-backend group too, in
# case the ignore list is ever narrowed later. A human bumps them by hand when
# the gated bead calls for it. Pinned + mutation-verified by
# tests/test_dependabot_config.py.
#
# The TypeScript-toolchain packages excluded from every npm group below
# (typescript, @types/node, vite, vitest, plus @vitest/*, @vitejs/plugin-react
# and @vitejs/plugin-react-swc) are the same fix for the same reason (bd
# polyglot-pdf-lwka0 scope addition, 2026-09-23): #862/#863/#864 (grouped npm
# bumps in admin-console, frontend and schema-editor, opened together on
# 2026-09-19 and merged together on 2026-09-23) broke all three front-end
# type-checks after landing on dev -- the TypeScript bump dropped the
# downlevelIteration and baseUrl compiler options the tsconfigs still set
# (TS5102), and the updated Node type definitions broke every node:* import
# and __dirname use in the vitest files (TS2591/TS2304). Each of the three
# PRs was RED in the matching frontend job (#863 failed at `npm run
# typecheck` with those exact TS5102 errors) and was merged by hand anyway;
# all four grouped bumps of that morning (the three npm ones and the backend
# pip bump #865) were reverted together in #867, as #830 had reverted the
# previous batch of four (pip plus the same TypeScript-toolchain bump). typescript, @types/node, vite and vitest pin the TS surface every
# front-end package compiles and tests against, so a real bump of any of
# them needs a deliberate, reviewed bead the same way the five backend
# packages do -- not an automatic grouped PR. @vitest/ui and
# @vitest/coverage-v8 require an EXACT matching vitest version (peer dep),
# and @vitejs/plugin-react is range-coupled to vite's supported-version
# range the same way (it stays on a caret range, not an exact pin), so
# excluding vitest/vite alone without also excluding these leaves Dependabot
# free to try bumping the peer-locked packages on their own, which either
# drags vitest/vite along anyway or opens a PR with an unresolvable
# peer-dependency lockfile -- the same red-PR shape this guard exists to
# stop. @vitejs/plugin-react-swc (frontend/package.json only; admin-console
# and schema-editor use @vitejs/plugin-react instead) has the identical
# peerDependencies.vite coupling and was missed in the original scope
# addition (found by the lwka0 outer cross-surface review, 2026-09-23) --
# folded into the same exclusion/ignore lists as its non-SWC sibling in every
# npm update entry, even the two that do not declare it today, so the guard
# does not have to be re-added the day one of them switches to the SWC
# variant. A human bumps it by hand when that bead calls for it. Pinned +
# mutation-verified by tests/test_dependabot_config.py.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
    groups:
      # MINOR + PATCH only (bd polyglot-pdf-niwcu). A MAJOR bump of any other
      # package arrives as its own single-package PR, never inside the batch:
      # #882 grouped seven majors (structlog 23->26, pytest 7->9, pytest-asyncio
      # 0.21->1.4, pytest-cov 5->7, librosa 0.10->1.0, firebase-admin 6->7,
      # google-cloud-storage 2->3) with twelve minor/patch bumps, broke the
      # staging verify gate (structlog 26 let exception messages --
      # client field values -- reach the logs), and had to be pinned back.
      # A single-package PR is reviewable and revertible on its own.
      all-pip-backend:
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "*"
        exclude-patterns:
          - "google-genai"
          - "websockets"
          - "uvicorn"
          - "fastapi"
          - "starlette"
          # HELD until its upgrade bead lands (see the ignore: block below).
          - "structlog"
          - "pytest"
          - "pytest-asyncio"
          - "pytest-cov"
          - "PyMuPDF"
          - "librosa"
          - "soundfile"
          - "firebase-admin"
          - "google-cloud-storage"
    ignore:
      - dependency-name: "google-genai"
      - dependency-name: "websockets"
      - dependency-name: "uvicorn"
      - dependency-name: "fastapi"
      - dependency-name: "starlette"
      # HELD packages (bd polyglot-pdf-niwcu): pinned back from #882 and being
      # upgraded deliberately, each behind its own validation. Several of their
      # #882 jumps were MINOR by Dependabot's reckoning (PyMuPDF 1.24 -> 1.28,
      # soundfile 0.12 -> 0.14, and 0.x bumps of librosa / pytest-asyncio), so
      # update-types alone would put them straight back into the next grouped
      # PR. Each upgrade bead's PR REMOVES its own entries here (and from the
      # exclude-patterns above and HELD_FOR_UPGRADE in
      # tests/test_dependabot_config.py) when it lands.
      - dependency-name: "structlog"             # bd polyglot-pdf-6wkzi
      - dependency-name: "pytest"                # bd polyglot-pdf-oy37r
      - dependency-name: "pytest-asyncio"        # bd polyglot-pdf-oy37r
      - dependency-name: "pytest-cov"            # bd polyglot-pdf-oy37r
      - dependency-name: "PyMuPDF"               # bd polyglot-pdf-k5dnc
      - dependency-name: "librosa"               # bd polyglot-pdf-m9h4w
      - dependency-name: "soundfile"             # bd polyglot-pdf-m9h4w
      - dependency-name: "firebase-admin"        # bd polyglot-pdf-d5rsx
      - dependency-name: "google-cloud-storage"  # bd polyglot-pdf-d5rsx
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    groups:
      all-npm-frontend:
        # MINOR + PATCH only (bd polyglot-pdf-fx8gg): a major arrives as its
        # own PR -- #880/#884/#885 batched React 19, Tailwind 4 and more, merged
        # red, and were reverted in #888.
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "*"
        exclude-patterns:
          - "typescript"
          - "@types/node"
          - "vite"
          - "vitest"
          - "@vitest/*"
          - "@vitejs/plugin-react"
          - "@vitejs/plugin-react-swc"
          # HELD until its upgrade bead lands (reverted in #888, bd fx8gg).
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
          - "@testing-library/react"
          - "pdfjs-dist"
          - "tailwindcss"
          - "react-router-dom"
          - "jsdom"
          - "@testing-library/jest-dom"
    ignore:
      - dependency-name: "typescript"
      - dependency-name: "@types/node"
      - dependency-name: "vite"
      - dependency-name: "vitest"
      - dependency-name: "@vitest/*"
      - dependency-name: "@vitejs/plugin-react"
      - dependency-name: "@vitejs/plugin-react-swc"
      # HELD (reverted in #888): each upgrade bead's PR removes its own entries.
      - dependency-name: "react"                         # bd polyglot-pdf-lhrnq
      - dependency-name: "react-dom"                     # bd polyglot-pdf-lhrnq
      - dependency-name: "@types/react"                  # bd polyglot-pdf-lhrnq
      - dependency-name: "@types/react-dom"              # bd polyglot-pdf-lhrnq
      - dependency-name: "@testing-library/react"        # bd polyglot-pdf-lhrnq
      - dependency-name: "pdfjs-dist"                    # bd polyglot-pdf-q0i7k
      - dependency-name: "tailwindcss"                   # bd polyglot-pdf-umd8r
      - dependency-name: "react-router-dom"              # bd polyglot-pdf-vxssq
      - dependency-name: "jsdom"                         # bd polyglot-pdf-50zcc
      - dependency-name: "@testing-library/jest-dom"     # bd polyglot-pdf-50zcc
  - package-ecosystem: "npm"
    directory: "/schema-editor"
