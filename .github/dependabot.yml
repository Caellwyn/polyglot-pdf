          # HELD until its upgrade bead lands (reverted in #888, bd fx8gg).
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
          - "@testing-library/react"
          - "pdfjs-dist"
          - "tailwindcss"
          - "react-router-dom"
          - "jsdom"
          - "@testing-library/jest-dom"
    ignore:
      - dependency-name: "typescript"
      - dependency-name: "@types/node"
      - dependency-name: "vite"
      - dependency-name: "vitest"
      - dependency-name: "@vitest/*"
      - dependency-name: "@vitejs/plugin-react"
      - dependency-name: "@vitejs/plugin-react-swc"
      # HELD (reverted in #888): each upgrade bead's PR removes its own entries.
      - dependency-name: "react"                         # bd polyglot-pdf-lhrnq
      - dependency-name: "react-dom"                     # bd polyglot-pdf-lhrnq
      - dependency-name: "@types/react"                  # bd polyglot-pdf-lhrnq
      - dependency-name: "@types/react-dom"              # bd polyglot-pdf-lhrnq
      - dependency-name: "@testing-library/react"        # bd polyglot-pdf-lhrnq
      - dependency-name: "pdfjs-dist"                    # bd polyglot-pdf-q0i7k
      - dependency-name: "tailwindcss"                   # bd polyglot-pdf-umd8r
      - dependency-name: "react-router-dom"              # bd polyglot-pdf-vxssq
      - dependency-name: "jsdom"                         # bd polyglot-pdf-50zcc
