# Informational CI -- runs the four test suites on every PR.
#
# NON-BLOCKING BY DESIGN (bd polyglot-pdf-uov.3): this workflow reports status
# but is NOT a required check. The merge gate (auto-merge for a routine low-risk
# PR that reviewed CLEAN, else a maintainer merge -- bd polyglot-pdf-16pj) and the
# inert required_deployments ruleset stay the only merge controls; do NOT add this
# job to branch-protection required checks without a separate decision. Its job is
# fast signal on a PR, not a gate.
#
# xfail/xpass policy: a spec-test that documents a known defect is marked xfail
# (pytest) or test.fails (vitest) and counts as PASS -- neither runner sets a
# non-zero exit for an expected failure, so this CI goes green on an
# intentionally-red spec, exactly as the spec-driven-test epic requires. A real
# regression (an unexpected failure) still exits non-zero and shows red here.
name: CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  backend-tests:
    name: backend pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install backend deps (runtime + test tooling)
        # requirements-dev.txt pulls in requirements.txt and adds pytest; the
        # image installs requirements.txt alone, so no test tooling ships.
        run: pip install -r backend/requirements-dev.txt
      - name: Run all collected suites (excluding flaky live-Gemini externals)
        # NO explicit suite paths: a bare `pytest` collects every root in
        # pytest.ini's `testpaths`, so a NEW top-level suite runs in CI the day
        # it is added instead of needing this line edited too. Hardcoding
        # `backend/tests tests` here is what let a whole suite ship un-run
        # before (bd polyglot-pdf-3ave: "CI runs `pytest backend/tests tests`,
        # so the PR would have merged CI-red"), and it silently under-ran
        # admin_backend/tests the day that package landed.
        # -m "not external" matches the project's flaky live-Gemini exclusion
        # (the `external` marker needs real Gemini creds CI does not have).
        run: pytest -q -m "not external"

  frontend-tests:
    name: frontend vitest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install (frontend)
        working-directory: frontend
        run: npm ci
      - name: Type-check (frontend)
        # tsc --noEmit gates the type-error class that vitest (transpile-only)
        # cannot catch (bd polyglot-pdf-uov.17). A new type error fails this
        # step -> the job goes red. Informational like the rest of this
        # workflow; not a required check (the uov.3 non-blocking-by-design note
        # above governs).
        working-directory: frontend
        run: npm run typecheck
      - name: Test (frontend)
        working-directory: frontend
        run: npm run test:run

  schema-editor-tests:
    name: schema-editor vitest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install (schema-editor)
        working-directory: schema-editor
        run: npm ci
      - name: Type-check (schema-editor)
        # tsc --noEmit gates the type-error class that vitest (transpile-only)
        # cannot catch -- this job used to run vitest only, which let a
        # build-breaking-but-test-green change (an ES2020-incompatible
        # Array.prototype.at call) reach review (bd polyglot-pdf-1rgr).
        working-directory: schema-editor
        run: npm run typecheck
      - name: Test (schema-editor)
        working-directory: schema-editor
        run: npm run test:run

  admin-console-tests:
    name: admin-console vitest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install (admin-console)
        working-directory: admin-console
        run: npm ci
      - name: Type-check (admin-console)
        # Same reasoning as the schema-editor job above: tsc --noEmit catches
        # a type-error class vitest's transpile-only run cannot (the
        # polyglot-pdf-1rgr lesson, applied to this new suite from day one --
        # bd polyglot-pdf-b6943).
        working-directory: admin-console
        run: npm run typecheck
      - name: Test (admin-console)
        working-directory: admin-console
        run: npm run test:run

  security:
    name: security scans (informational)
    runs-on: ubuntu-latest
    # INFORMATIONAL like every job in this workflow (see the header): the
    # scans report, they do not gate. Making this job required is a separate
    # maintainer decision (sprint 23 workstream G records the ask). Each step
    # continues on error so ONE noisy scanner cannot hide the others' output.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install scanners
        run: pip install pip-audit bandit detect-secrets semgrep
      - name: pip-audit (runtime requirements only)
        continue-on-error: true
        run: pip-audit -r backend/requirements.txt --strict --desc
      - name: npm audit (frontend, production deps)
        continue-on-error: true
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
      - name: npm audit (schema-editor, production deps)
        continue-on-error: true
        working-directory: schema-editor
        run: npm audit --omit=dev --audit-level=high
      - name: npm audit (admin-console, production deps)
        continue-on-error: true
        working-directory: admin-console
        run: npm audit --omit=dev --audit-level=high
      - name: detect-secrets (files changed by this PR, against the baseline)
        continue-on-error: true
        # Only the PR's own files are scanned, against .secrets.baseline, so a
        # NEW secret shape fails here while the audited baseline stays quiet.
        run: |
          git diff --name-only --diff-filter=ACMR "origin/${{ github.base_ref }}...HEAD" \
            | grep -v -E '^(scripts/spikes/|\.beads/)' \
            | xargs -r detect-secrets-hook --baseline .secrets.baseline
      - name: bandit (medium+ severity, both backends)
        continue-on-error: true
        run: bandit -r backend admin_backend -ll -x backend/tests,admin_backend/tests
      - name: semgrep (Python + TypeScript rulesets)
        continue-on-error: true
        # Linux-only tool (no Windows build), so it lives here rather than in
        # the local pre-PR checks.
        run: semgrep --config p/python --config p/typescript --error --quiet backend admin_backend frontend/src schema-editor/src admin-console/src
